[project]
name = "trado-lab"
version = "0.1.0"
description = "Backtest-Labor für Trado: Hypothesen schnell scannen (numba) und realistisch prüfen (NautilusTrader)"
requires-python = ">=3.13,<3.15"
dependencies = [
    "nautilus_trader[visualization]>=2.0.0rc7",
    "numba>=0.61",
    "numpy",
    "pandas",
    "pyarrow",
]

[project.optional-dependencies]
# nur für scan/pruefe_trado_features.py (lädt Trados Config)
pruefung = ["pydantic>=2.7", "pyyaml>=6.0", "python-dotenv>=1.0"]

[tool.uv]
prerelease = "if-necessary-or-explicit"

[tool.setuptools]
packages = ["lab", "strategies", "scan"]
